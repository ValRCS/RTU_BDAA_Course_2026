name: Fix 06_04 notebook rendering

on:
  push:
    paths:
      - '.github/workflows/fix_06_04_notebook_render.yml'

permissions:
  contents: write

jobs:
  fix-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch notebook JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/lecture_06_web_scraping/06_04_ss_com_full_scraping_workflow.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          changed = False
          old = 'Pārvērš vienu SS.com sludinājuma <tr> elementu par vārdnīcu.'
          new = 'Pārvērš vienu SS.com sludinājuma HTML rindas elementu par vārdnīcu.'

          for cell in nb.get('cells', []):
              if cell.get('cell_type') != 'code':
                  continue
              source = cell.get('source', '')
              if isinstance(source, list):
                  joined = ''.join(source)
                  if old in joined:
                      joined = joined.replace(old, new)
                      cell['source'] = joined
                      changed = True
              elif old in source:
                  cell['source'] = source.replace(old, new)
                  changed = True

          if nb.get('nbformat') == 4 and nb.get('nbformat_minor') == 5:
              if any('id' not in cell for cell in nb.get('cells', [])):
                  nb['nbformat_minor'] = 4
                  changed = True

          if not changed:
              raise SystemExit('Nothing to change; refusing empty commit')

          path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          PY
      - name: Validate notebook JSON and Python cells
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/lecture_06_web_scraping/06_04_ss_com_full_scraping_workflow.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          assert nb['nbformat'] == 4
          assert nb['nbformat_minor'] == 4
          for index, cell in enumerate(nb['cells']):
              if cell.get('cell_type') == 'code':
                  source = cell.get('source', '')
                  if isinstance(source, list):
                      source = ''.join(source)
                  compile(source, f'cell_{index}', 'exec')
          print(f"Validated {len(nb['cells'])} cells")
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/lecture_06_web_scraping/06_04_ss_com_full_scraping_workflow.ipynb
          git commit -m 'Fix GitHub rendering of SS.com workflow notebook'
          git push
